[project]
name = "evidence-room"
version = "0.1.0"
description = "Retrieval layer for rubric-based grading of induction proofs"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
