[project]
name = "evidence-room"
version = "0.1.0"
description = "Retrieval layer for rubric-based grading of induction proofs"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "rank-bm25>=0.2.2",
    "fastembed>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
